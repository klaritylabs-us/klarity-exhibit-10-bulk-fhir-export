[package]
name = "klarity-exhibit-10-bulk-fhir-export"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FHIR bulk export manifest checks"
publish = false

[lib]
name = "bulk_export"
path = "src/lib.rs"

[[bin]]
name = "validate-bulk"
path = "src/bin/validate_bulk.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
